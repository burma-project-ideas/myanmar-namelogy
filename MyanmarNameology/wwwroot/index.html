<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myanmar Nameology</title>
    <meta name="description" content="Compact Myanmar name number calculator built with Blazor WebAssembly." />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <link rel="stylesheet" href="css/untitled.css?v=ui2" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress" aria-hidden="true" focusable="false">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text" role="status" aria-live="polite" aria-label="Loading application" lang="en"></div>
    </div>

    <div id="blazor-error-ui" role="alert" lang="en">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss">Close</button>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
